name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install life-garden dependencies
        run: npm ci
        working-directory: life-garden

      - name: Build life-garden
        run: npm run build
        working-directory: life-garden

      - name: Install warm-home dependencies
        run: npm ci
        working-directory: warm-home

      - name: Build warm-home
        run: npm run build
        working-directory: warm-home

      - name: Assemble dist (life-garden + warm-home)
        run: |
          mkdir -p dist/life-garden
          mkdir -p dist/warm-home
          cp -r life-garden/dist/. dist/life-garden/
          cp -r warm-home/dist/. dist/warm-home/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4