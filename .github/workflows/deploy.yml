name: Build & Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache-dependency-path: |
            life-garden/package-lock.json
            warm-home/package-lock.json

      - name: Install life-garden dependencies
        run: cd life-garden && npm ci

      - name: Build life-garden
        run: cd life-garden && npm run build

      - name: Install warm-home dependencies
        run: cd warm-home && npm ci

      - name: Verify warm-home grids (no browser needed)
        run: cd warm-home && npm run verify

      - name: Build warm-home
        run: cd warm-home && npm run build

      - name: Assemble dist (life-garden + warm-home + landing)
        run: |
          mkdir -p dist/life-garden
          mkdir -p dist/warm-home
          cp -r life-garden/dist/. dist/life-garden/
          cp -r warm-home/dist/. dist/warm-home/
          cp shared/index.html dist/index.html
          # Pages 根目錄關掉 Jekyll，避免底線開頭檔被忽略
          touch dist/.nojekyll

      - name: Verify PWA artifacts (manifest + SW + icons)
        run: |
          test -f dist/warm-home/manifest.webmanifest || (echo "❌ warm-home manifest 缺失" && exit 1)
          test -f dist/warm-home/sw.js || (echo "❌ warm-home sw.js 缺失" && exit 1)
          test -f dist/warm-home/icons/icon-192.png || (echo "❌ warm-home icon 缺失" && exit 1)
          test -f dist/life-garden/manifest.webmanifest || (echo "❌ life-garden manifest 缺失" && exit 1)
          test -f dist/life-garden/sw.js || (echo "❌ life-garden sw.js 缺失" && exit 1)
          echo "✅ PWA 產物齊全，可離線安裝使用"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4